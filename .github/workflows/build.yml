name: Compilar Mod

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Baixar Dependencias
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path libs/BepInEx/core, libs/BepInEx/interop
          Invoke-WebRequest -Uri "https://github.com" -OutFile "libs/Reactor.dll"
          Invoke-WebRequest -Uri "https://bepinex.dev" -OutFile "bepinex.zip"
          Expand-Archive -Path "bepinex.zip" -DestinationPath "libs" -Force
      - name: Compilar FamilyRoles
        run: dotnet build -c Release
      - name: Disponibilizar DLL para Download
        uses: actions/upload-artifact@v4
        with:
          name: FamilyRoles-Mod
          path: bin/Release/net6.0/FamilyRoles.dll
